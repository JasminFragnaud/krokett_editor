[workspace]
members = ["krokett_editor", "krokett_editor_native", "krokett_editor_web", "krokett_editor_android/rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
walkers = "0.53.0"
log = "0.4.29"
egui = "0.34.2"
egui_extras = { version = "0.34.2", features = ["svg"] }
eframe = "0.34.2"
egui-winit = "0.34.2"
